name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.12"]
        exclude:
          - os: macos-latest
            python: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Structure, manifests and references
        run: python tools/validate.py
      - name: Script tests
        run: python -m unittest discover -s tests -v
      - name: Scripts run on this repo
        run: |
          python plugins/prc/skills/project-coordinator/scripts/measure.py .
          python plugins/prc/skills/project-coordinator/scripts/ledger.py tests/fixtures/sample-project --ascii
      - name: install.sh round trip
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude"
          sh install.sh --dry-run
          test ! -e "$CLAUDE_CONFIG_DIR/skills"
          sh install.sh
          test -f "$CLAUDE_CONFIG_DIR/skills/project-coordinator/SKILL.md"
          test -f "$CLAUDE_CONFIG_DIR/commands/prc-status.md"
          sh install.sh --uninstall
          test ! -e "$CLAUDE_CONFIG_DIR/skills/project-coordinator"
      - name: install.ps1 round trip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'claude'
          ./install.ps1 -DryRun
          if (Test-Path "$env:CLAUDE_CONFIG_DIR\skills") { throw 'dry run wrote files' }
          ./install.ps1
          if (-not (Test-Path "$env:CLAUDE_CONFIG_DIR\skills\project-coordinator\SKILL.md")) { throw 'skill missing' }
          if (-not (Test-Path "$env:CLAUDE_CONFIG_DIR\commands\prc-status.md")) { throw 'command missing' }
          ./install.ps1 -Uninstall
          if (Test-Path "$env:CLAUDE_CONFIG_DIR\skills\project-coordinator") { throw 'uninstall left the skill' }

  claude-plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Official plugin validator (strict)
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate --strict .
          claude plugin validate --strict plugins/prc
